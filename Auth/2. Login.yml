info:
  name: 2. Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "admin@fiterio.com",
        "password": "Password123!"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "var jsonData = res.getBody();\r

        if (jsonData.data && jsonData.data.accessToken) {\r

        //     pm.collectionVariables.set(\"token\", jsonData.data.accessToken);\r

        //     pm.collectionVariables.set(\"refreshToken\", jsonData.data.refreshToken);\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
