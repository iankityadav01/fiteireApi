info:
  name: 4. Forgot Password
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/forgot-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "admin@fiterio.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
