info:
  name: 5. Reset Password
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/reset-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "admin@fiterio.com",
        "otp": "123456",
        "newPassword": "NewPassword123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
