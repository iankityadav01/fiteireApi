info:
  name: Verify Bank Account
  type: http
  seq: 3
http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/coach-management/bank-account/admin/:id/verify"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "isVerified": true
      }
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
