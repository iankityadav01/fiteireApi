info:
  name: Add Pricing Option
  type: http
  seq: 7
http:
  method: POST
  url: "{{baseUrl}}/api/v1/coach-management/availability/me/pricing"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "durationMins": 30,
        "price": 400,
        "currency": "INR"
      }
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
