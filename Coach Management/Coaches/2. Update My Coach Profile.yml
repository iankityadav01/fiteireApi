info:
  name: Update My Coach Profile
  type: http
  seq: 2
http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/coach-management/coaches/me"
  headers:
    - name: Content-Type
      value: multipart/form-data
  body:
    type: form
    data: |-
      # Update my coach profile (multipart)
      firstName=John
      lastName=Doe
      bio=Updated bio - I specialize in fitness coaching.
      experienceYears=7
      startingPrice=600
      currency=INR
      sessionDurationMins=45
      isAvailableForOnline=true
      isAvailableForOffline=true
      # Upload replacement image
      target=coverPhoto
      file=@/path/to/cover-updated.jpg
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
