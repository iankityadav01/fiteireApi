info:
  name: Update My Coach Profile
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/coach-management/coaches/me"
  headers:
    - name: Content-Type
      value: multipart/form-data
  body:
    type: form
    data: |-
      # Update profile image: Set 'file' (File) and 'target' = 'profileImage'
      # Update cover photo: Set 'file' (File) and 'target' = 'coverPhoto'
      file=@/path/to/image.jpg
      target=profileImage
      firstName=Ankit
      lastName=Yadavv
      bio=Updated coach bio
      experienceYears=5
      startingPrice=1200
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
