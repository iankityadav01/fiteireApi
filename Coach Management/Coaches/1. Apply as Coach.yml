info:
  name: Apply as Coach
  type: http
  seq: 1
http:
  method: POST
  url: "{{baseUrl}}/api/v1/coach-management/coaches/me"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "firstName": "John",
        "lastName": "Doe",
        "bio": "I am an experienced coach.",
        "profileImage": "https://example.com/profile.jpg",
        "coverPhoto": "https://example.com/cover.jpg",
        "experienceYears": 5,
        "startingPrice": 500,
        "currency": "INR",
        "sessionDurationMins": 60,
        "isOnline": true,
        "isAvailableForOnline": true,
        "isAvailableForOffline": false,
        "introVideoUrl": "https://example.com/intro.mp4"
      }
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
