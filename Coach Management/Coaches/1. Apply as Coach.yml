info:
  name: Apply as Coach
  type: http
  seq: 1
http:
  method: POST
  url: "{{baseUrl}}/api/v1/coach-management/coaches/me"
  headers:
    - name: Content-Type
      value: multipart/form-data
  body:
    type: form
    data: |-
      # Apply as coach (multipart/form-data)
      firstName=John
      lastName=Doe
      bio=I am an experienced coach.
      experienceYears=5
      startingPrice=500
      currency=INR
      sessionDurationMins=60
      isOnline=true
      isAvailableForOnline=true
      isAvailableForOffline=false
      introVideoUrl=https://example.com/intro.mp4
      # To upload an image, include file and set target to profileImage or coverPhoto
      target=profileImage
      file=@/path/to/profile.jpg
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
