info:
  name: 4. Update Quote (Admin)
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/motivation-quotes/{{quoteId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "weight": 150,
        "status": "ACTIVE"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
