info:
  name: 7. Get Quote By ID (Admin)
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/v1/motivation-quotes/{{quoteId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
