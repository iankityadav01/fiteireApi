info:
  name: 1. Get Daily Quote
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/motivation-quotes/daily?lang=en"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
