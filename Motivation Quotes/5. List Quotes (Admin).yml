info:
  name: 5. List Quotes (Admin)
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/motivation-quotes?page=1&limit=20&status=ACTIVE"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
