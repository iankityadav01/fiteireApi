info:
  name: Add User Device (Admin)
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/v1/users/:userId/devices"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "fcmToken": "token123",
        "platform": "ANDROID"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
