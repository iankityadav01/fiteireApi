info:
  name: Update My Device
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/user-management/users/me/devices/:id"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "deviceName": "My iPhone"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
