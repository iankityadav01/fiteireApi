info:
  name: Add My Device
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/users/me/devices"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "fcmToken": "token123",
        "deviceName": "iPhone",
        "platform": "IOS"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
