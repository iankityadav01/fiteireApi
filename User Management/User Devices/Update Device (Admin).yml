info:
  name: Update Device (Admin)
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/user-management/devices/:id"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "isActive": false
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
