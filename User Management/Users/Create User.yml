info:
  name: Create User
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/users"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "new@fiterio.com",
        "password": "Password123!"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
