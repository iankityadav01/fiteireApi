info:
  name: Update Current User (/me)
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/users/me"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "phone": "1234567890"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
