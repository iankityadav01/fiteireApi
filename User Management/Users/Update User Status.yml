info:
  name: Update User Status
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/user-management/users/:id/status"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "status": "ACTIVE"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
