info:
  name: Update User Role
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/users/:id/role"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "roleId": "ROLE_UUID_HERE"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
