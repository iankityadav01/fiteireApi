info:
  name: Update My Preferences
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/user-management/users/me/preferences"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "pushNotifications": false
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
