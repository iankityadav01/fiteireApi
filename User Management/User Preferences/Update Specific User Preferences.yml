info:
  name: Update Specific User Preferences
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/user-management/users/:userId/preferences"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "pushNotifications": true
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
