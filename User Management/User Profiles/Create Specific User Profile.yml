info:
  name: Create Specific User Profile
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/users/:userId/profile"
  headers:
    - name: Content-Type
      value: multipart/form-data
  body:
    type: form
    data: |-
      # Form fields (use multipart/form-data)
      firstName=Admin
      lastName=User
      displayName=Admin User
      bio=Admin profile bio
      city=New York
      state=NY
      country=USA
      # To upload a file, include the file field and set `target` to either `profileImage` or `coverPhoto`
      target=profileImage
      file=@/path/to/admin-profile.jpg
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
