info:
  name: Create Specific User Profile
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/users/:userId/profile"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "firstName": "Admin",
        "lastName": "User",
        "displayName": "Admin User",
        "bio": "Admin profile bio",
        "profileImage": "https://example.com/admin-profile.jpg",
        "coverPhoto": "https://example.com/admin-cover.jpg",
        "city": "New York",
        "state": "NY",
        "country": "USA"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
