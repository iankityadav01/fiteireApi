info:
  name: Update Profile (Admin)
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/profiles/:id"
  headers:
    - name: Content-Type
      value: multipart/form-data
  body:
    type: form
    data: |-
      # Admin update profile (multipart)
      bio=Admin updated bio
      target=coverPhoto
      file=@/path/to/new-cover.jpg
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
