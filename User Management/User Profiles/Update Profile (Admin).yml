info:
  name: Update Profile (Admin)
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/user-management/profiles/:id"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "bio": "Admin updated bio"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
