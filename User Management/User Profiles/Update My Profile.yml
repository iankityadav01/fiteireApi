info:
  name: Update My Profile
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/users/me/profile"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "firstName": "John",
        "lastName": "Doe",
        "displayName": "John D.",
        "bio": "Updated bio",
        "profileImage": "https://example.com/john-profile.jpg",
        "coverPhoto": "https://example.com/john-cover.jpg"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
