info:
  name: Update My Profile
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/users/me/profile"
  headers:
    - name: Content-Type
      value: multipart/form-data
  body:
    type: form
    data: |-
      # Multipart form to update profile (current user)
      firstName=John
      lastName=Doe
      displayName=John D.
      bio=Updated bio
      # To upload an image, include file and set target to profileImage or coverPhoto
      target=profileImage
      file=@/path/to/john-profile.jpg
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
