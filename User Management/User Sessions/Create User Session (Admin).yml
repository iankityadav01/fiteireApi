info:
  name: Create User Session (Admin)
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v1/user-management/users/:userId/sessions"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "sessionToken": "raw-token",
        "expiresAt": "2026-12-31T00:00:00.000Z"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
