info:
  name: 7. Update Global Preferences
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/notifications/preferences"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "pushEnabled": true
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
