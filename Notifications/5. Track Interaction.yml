info:
  name: 5. Track Interaction
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/notifications/:id/interactions"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "action": "tapped"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
