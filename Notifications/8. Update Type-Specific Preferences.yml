info:
  name: 8. Update Type-Specific Preferences
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/notifications/preferences/types/:typeSlug"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "isMuted": false
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
