info:
  name: 9. Register Device Token
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/v1/notifications/device-tokens"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "token": "sample-token",
        "platform": "ANDROID"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
