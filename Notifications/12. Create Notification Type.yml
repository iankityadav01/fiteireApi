http:
  method: POST
  url: "{{baseUrl}}/api/v1/admin/notifications/types"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "slug": "TEST_TYPE",
        "label": "Test Type",
        "description": "desc",
        "category": "SYSTEM",
        "defaultChannels": ["IN_APP"]
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
