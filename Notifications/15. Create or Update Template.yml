info:
  name: 15. Create or Update Template
  type: http
  seq: 15

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/admin/notifications/types/:typeId/templates"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "channel": "IN_APP",
        "title": "Title",
        "body": "Body"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
