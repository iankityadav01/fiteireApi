info:
  name: Track Reel View
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v1/reels/REEL_UUID_HERE/view"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "watchedSeconds": 15.5
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
