info:
  name: Add Reel Comment
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/api/v1/reels/REEL_UUID_HERE/comments"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "comment": "Incredible form! Thanks for sharing."
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
