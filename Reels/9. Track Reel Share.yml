info:
  name: Track Reel Share
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/v1/reels/REEL_UUID_HERE/share"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "platform": "whatsapp"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
