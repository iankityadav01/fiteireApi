info:
  name: List Coach Bookings
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/v1/booking-and-sessions/bookings/coach"
  auth:
    type: bearer
    token: "{{token}}"
  query:
    - name: page
      value: 1
    - name: limit
      value: 10
    - name: status
      value: CONFIRMED
      enabled: false

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
