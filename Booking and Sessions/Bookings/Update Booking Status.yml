info:
  name: Update Booking Status
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/booking-and-sessions/bookings/:id/status"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "status": "CONFIRMED",
        "reason": "Payment received"
      }
  auth: inherit
  params:
    - name: id
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
