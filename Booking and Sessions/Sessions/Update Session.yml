info:
  name: Update Session
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/booking-and-sessions/sessions/:id"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "sessionNotes": "Notes about the session"
      }
  auth: inherit
  params:
    - name: id
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
