info:
  name: 4. Update Refund Status
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/payment-financials/refunds/:id/status"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "status": "SUCCESS"
      }
  auth: inherit
  params:
    - name: id
      value: "PASTE_REFUND_UUID_HERE"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5