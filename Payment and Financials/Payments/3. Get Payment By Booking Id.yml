info:
  name: 3. Get Payment By Booking Id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/payment-financials/payments/booking/:bookingId"
  auth: inherit
  params:
    - name: bookingId
      value: "PASTE_BOOKING_UUID_HERE"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5