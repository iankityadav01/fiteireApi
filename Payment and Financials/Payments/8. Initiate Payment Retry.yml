info:
  name: 8. Initiate Payment Retry
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/v1/payment-financials/payments/initiate"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "bookingId": "PASTE_BOOKING_UUID_HERE"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
