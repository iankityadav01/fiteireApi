info:
  name: 4. Create Coach Earning
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/payment-financials/coach-earnings"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "coachId": "PASTE_COACH_UUID_HERE",
        "bookingId": "PASTE_BOOKING_UUID_HERE",
        "grossAmount": 1000,
        "commissionAmt": 150,
        "netAmount": 850
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5