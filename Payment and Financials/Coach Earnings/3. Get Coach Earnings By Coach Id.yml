info:
  name: 3. Get Coach Earnings By Coach Id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/payment-financials/coach-earnings/coach/:coachId?page=1&limit=10"
  auth: inherit
  params:
    - name: coachId
      value: "PASTE_COACH_UUID_HERE"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5