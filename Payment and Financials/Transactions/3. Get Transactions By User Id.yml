info:
  name: 3. Get Transactions By User Id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/payment-financials/transactions/user/:userId?page=1&limit=10"
  auth: inherit
  params:
    - name: userId
      value: "PASTE_USER_UUID_HERE"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5