info:
  name: 4. Get Transactions By Payment Id
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/payment-financials/transactions/payment/:paymentId?page=1&limit=10"
  auth: inherit
  params:
    - name: paymentId
      value: "PASTE_PAYMENT_UUID_HERE"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5