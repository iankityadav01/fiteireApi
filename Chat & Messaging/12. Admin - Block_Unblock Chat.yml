info:
  name: 12. Admin - Block/Unblock Chat
  type: http
  seq: 12

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/chat/admin/chats/:chatId/status"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "status": "BLOCKED",
        "reason": "Violation of community guidelines"
      }
  auth: inherit
