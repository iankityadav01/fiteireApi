info:
  name: 5. Send Message
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/chat/chats/:chatId/messages"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "type": "TEXT",
        "content": "Hello, how are you today?"
      }
  auth: inherit
