info:
  name: 3. Resolve Flag Report
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/admin-moderation/moderation/reports/:id/resolve"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "PASTE_REPORT_ID_HERE"
  body:
    type: json
    data: |-
      {
        "actionTaken": "Reel review content and decided to delete the reported reel."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
